worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream webui_backend {
        server host.docker.internal:${WEBUI_PORT};
    }

    server {
        listen 80;
        server_name _;

        # Serve frontend static files
        root /usr/share/nginx/html;
        index index.html;

        # Editor assets are served by the aidir backend, not from this image:
        # they come from the installed aiset package, not from the repository.
        # ^~ is required, otherwise the asset-location rule below would win.
        location ^~ /assets/ {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # A missing file that names an extension must not fall back to
        # index.html. The SPA fallback answers 200 text/html for anything it
        # does not have, so a missing script silently reaches the browser as
        # HTML and only shows up as "the global is undefined" much later.
        location ~* \.(?:js|css|map|json|svg|ico|png|jpe?g|gif|webp|woff2?|ttf|eot)$ {
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API calls to webui backend.
        # ^~ on every proxied prefix: a plain prefix match would still be
        # overridden by the asset-extension rule further down, which would
        # answer /api/settings/assets/aiset.js with 404.
        location ^~ /api/ {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # WebSocket for log streaming
        location ^~ /ws/ {
            proxy_pass http://webui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
